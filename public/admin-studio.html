<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MealMate Admin - AI Recipe Processor</title>
    <style>
        body { background: #0f0f0f; color: #e0e0e0; font-family: sans-serif; display: flex; margin: 0; }
        .sidebar { width: 220px; background: #1a1a1a; height: 100vh; padding: 20px; border-right: 1px solid #333; }
        .main { flex: 1; padding: 40px; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 8px; margin-bottom: 15px; }
        .btn-ai { background: linear-gradient(45deg, #ff6b6b, #ff4757); color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .status-tag { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 12px; background: #2f3542; color: #747d8c; margin-right: 10px; }
        .status-tag.active { background: #2ed573; color: white; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>MealMate Admin</h3>
        <p>🎬 영상 자동 가공</p>
        <p>📦 재료 매칭 관리</p>
        <p>📊 배포 대시보드</p>
    </div>

    <div class="main">
        <h1>AI 레시피 엔진 🪄</h1>
        
        <div class="card">
            <h3>🔗 외부 영상 소스 입력</h3>
            <input type="text" id="sourceUrl" placeholder="Instagram Reels 또는 Shorts URL을 붙여넣으세요">
            <button class="btn-ai bg-red-500">AI 가공 및 레시피 추출 시작</button>
            <button id="extract-btn" class="btn-ai bg-red-500">AI 가공 및 레시피 추출 시작</button>
        </div>

        <div id="result-section" class="mt-8 bg-gray-900" style="display:none; padding: 25px; border-radius: 15px; border: 1px solid #333;">
            <div class="card">
                <h3 class="text-xl font-bold mb-4">🔍 AI 분석 결과 (자동 추출됨)</h3>
                <div style="margin-bottom: 15px;">
                    <span class="status-tag active">저작권 세탁 완료</span>
                    <span class="status-tag active">나레이션 생성 완료</span>
                    <span class="status-tag">쇼핑몰 상품 매칭 중...</span>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm mb-1">요리 제목</label>
                    <input type="text" id="recipe-title" class="w-full bg-gray-800" value="초간단 10분 김치찜">
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm mb-1">카테고리</label>
                    <input type="text" id="category" class="w-full bg-gray-800" placeholder="예: 한식, 중식, 양식, 디저트 등">
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm mb-1">요리 설명</label>
                    <textarea id="description" class="w-full bg-gray-800" rows="3" placeholder="요리에 대한 간단한 설명을 입력하세요"></textarea>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm mb-1">추출된 재료 (쇼핑몰 연동용)</label>
                    <textarea rows="4" id="recipe-ingredients" class="w-full bg-gray-800">돼지고기 앞다리살 300g, 묵은지 1/4포기, 대파 1대, 설탕 1큰술</textarea>
                </div>
                
                <div style="display: flex; gap: 20px;">
                    <div style="flex: 1; background: #000; height: 200px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                        원본 미리보기
                    </div>
                    <div style="flex: 1; background: #000; height: 200px; border-radius: 10px; border: 2px solid #ff6b6b; display: flex; align-items: center; justify-content: center;">
                        MealMate 가공본
                    </div>
                </div>
                
                <button class="btn-ai bg-pink-500" style="margin-top: 20px; width: 100%;">MealMate Shop에 최종 배포</button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const extractBtn = document.getElementById('extract-btn');
            const resultSection = document.getElementById('result-section');
            const titleInput = document.getElementById('recipe-title');
            const ingredientsInput = document.getElementById('recipe-ingredients');

            if (extractBtn) {
                extractBtn.addEventListener('click', function() {
                    // 1. 상태 변경
                    this.innerText = "⏳ AI 분석 중... 잠시만 기다려주세요";
                    this.disabled = true;

                    // 2. 시뮬레이션 (2초 후 데이터 채우기)
                    setTimeout(() => {
                        // 데이터 채우기
                        if (titleInput) titleInput.value = "초간단 10분 김치찜 (추출 완료)";
                        if (ingredientsInput) ingredientsInput.value = "돼지고기 300g, 묵은지 1/4포기, 양파 1/2개, 설탕 1큰술";

                        // 혹시 숨겨져 있다면 화면에 표시
                        if (resultSection) resultSection.style.display = "block";

                        // 버튼 복구
                        this.innerText = "AI 가공 및 레시피 추출 시작";
                        this.disabled = false;
                        
                        alert("AI가 레시피를 성공적으로 뽑아냈습니다! 아래 내용을 확인하세요.");
                    }, 2000);
                });
            }
        };

        // 배포 버튼 이벤트
        window.onload = (function() {
            const originalOnload = window.onload;
            return function() {
                if (originalOnload) originalOnload();

                const publishBtn = document.querySelector('button.bg-pink-500');
                const titleInput = document.getElementById('recipe-title');
                const ingredientsInput = document.getElementById('recipe-ingredients');

                if (publishBtn) {
                    publishBtn.addEventListener('click', async () => {
                        // 1. 화면에 있는 요리 제목과 재료 가져오기
                        const title = titleInput.value || "레시피";
                        const ingredients = ingredientsInput.value || "";

                        // 2. 버튼 상태를 '배포 중...'으로 변경 (중복 클릭 방지)
                        publishBtn.innerText = "배포 중...";
                        publishBtn.disabled = true;

                        try {
                            // 3. 서버 API로 데이터 전송
                            const response = await fetch('/api/publish', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    title: title,
                                    description: ingredients,
                                    category: 'AI 추천'
                                })
                            });

                            // 4. 응답 상태 확인
                            if (!response.ok) {
                                const errorText = await response.text();
                                throw new Error(`HTTP ${response.status}: ${errorText}`);
                            }

                            const result = await response.json();

                            if (result.success) {
                                alert("🚀 MealMate Shop에 성공적으로 배포되었습니다!");
                                // 입력창 초기화
                                titleInput.value = "초간단 10분 김치찜";
                                ingredientsInput.value = "돼지고기 앞다리살 300g, 묵은지 1/4포기, 대파 1대, 설탕 1큰술";
                            } else {
                                alert("배포 실패: " + (result.error || "알 수 없는 오류"));
                            }
                        } catch (err) {
                            console.error("배포 오류:", err);
                            alert("배포 중 오류가 발생했습니다.\n" + err.message);
                        } finally {
                            publishBtn.innerText = "MealMate Shop에 최종 배포";
                            publishBtn.disabled = false;
                        }
                    });
                }
            };
        })();
    </script>
</body>
</html>
