<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealMate Shop - 로그인</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --dark-bg: #121212;
            --card-bg: #1E1E1E;
        }
        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: var(--dark-bg);
            color: white;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }
        .login-container {
            width: 100%; max-width: 400px;
            padding: 40px 20px;
            text-align: center;
        }
        .hero-image {
            width: 100%; height: 200px;
            background: linear-gradient(45deg, #2a2a2a, #1a1a1a);
            border-radius: 20px;
            margin-bottom: 30px;
            display: flex; align-items: center; justify-content: center;
            /* 여기에 나중에 생성된 이미지를 배경으로 넣으세요 */
            font-size: 50px;
        }
        h1 { font-size: 28px; margin-bottom: 10px; font-weight: 800; }
        p { color: #aaa; font-size: 15px; margin-bottom: 40px; line-height: 1.5; }
        
        .login-buttons { display: flex; flex-direction: column; gap: 15px; }
        .btn {
            padding: 15px; border-radius: 12px;
            border: none; font-size: 16px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-google { background: white; color: #000; }
        .btn-kakao { background: #FEE500; color: #3C1E1E; }
        
        .footer-links { margin-top: 30px; font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="hero-image">💰🛒👨‍🍳</div>
        <h1>MealMate Shop</h1>
        <p>전국 마트 실시간 최저가 검색!<br>담은 재료로 만드는 1분 레시피까지.</p>

        <div class="login-buttons">
            <button class="btn btn-google" onclick="location.href='/auth/google'">
                <img src="https://www.google.com/favicon.ico" style="width:18px; margin-right:10px;"> 구글로 시작하기
            </button>
            <button class="btn btn-kakao" onclick="location.href='/auth/kakao'">
                카카오로 시작하기
            </button>
        </div>

        <div class="footer-links">
            로그인 시 이용약관 및 개인정보 처리방침에 동의하게 됩니다.
        </div>
    </div>

    <!-- MealMate 재료 매칭 시스템 -->
    <script src="js/database.js"></script>
    <script src="js/shopping-api.js"></script>
    <script src="js/ingredient-matcher.js"></script>
    <script src="js/examples.js"></script>
    
    <script>
        // 로그인 후 재료 매칭 데모
        function loginAndTest() {
            // 로그인 후 실행될 코드
            setTimeout(() => {
                console.log('🎯 MealMate 재료 매칭 시스템 준비 완료!');
                console.log('사용 가능한 함수:');
                console.log('- await ingredientMatcher.matchGroceryToMall([...])');
                console.log('- await ingredientMatcher.compareMultipleMalls("재료명")');
                console.log('- await completeWorkflow("userId", "recipeId")');
                console.log('\n개발자 콘솔에서 테스트할 수 있습니다.');
            }, 1000);
        }
    </script>

</body>
</html>
